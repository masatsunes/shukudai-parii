<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿題パリィ・シューティング『小言・バスターズ』</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-top: 20px; font-size: 24px; color: #ff4757; }
        canvas {
            background-color: #1e1e24;
            display: block;
            margin: 20px auto;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .instructions {
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
        }
        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🛡️ 宿題パリィ・シューティング『小言・バスターズ』</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="instructions">
        【操作方法】<br>
        <span class="key">Spaceキー</span>：**パリィ**（小言が自機に重なる瞬間に発動！）<br>
        <span class="key">Enterキー</span>：**必殺技「いつもありがとう！🌹」**（ゲージ満タン時に5秒間無敵＋ケーキ確定）
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ゲーム状態
let score = 0;
let life = 3;
let specialGauge = 0; // 100で満タン
let isInvincible = false;
let invincibleTimer = 0;
let gameOver = false;

// 自機 (プレイヤー)
const player = {
    x: 100,
    y: 200,
    radius: 20,
    isParrying: false,
    parryTimer: 0
};

// 弾（小言・ケーキ）の配列
let bullets = [];

// 小言データの定義
const textTemplates = [
    { text: "掃除はしたの？", speed: 4, type: "normal", color: "#ffa502" },
    { text: "提出物出した？", speed: 8, type: "fast", color: "#ff4757" },
    { text: "無駄遣いしてない？", speed: 1.5, type: "slow", color: "#1e90ff" }
];

// キー入力フラグ
let keys = {};

window.addEventListener("keydown", (e) => {
    if (gameOver) {
        if (e.code === "Space") restartGame();
        return;
    }

    if (e.code === "Space" && !player.isParrying) {
        player.isParrying = true;
        player.parryTimer = 10; // パリィの判定フレーム数
        checkParry();
    }
    if (e.code === "Enter" && specialGauge >= 100) {
        triggerSpecial();
    }
});

// ゲームリスタート
function restartGame() {
    score = 0;
    life = 3;
    specialGauge = 0;
    isInvincible = false;
    gameOver = false;
    bullets = [];
    loop();
}

// 必殺技発動
function triggerSpecial() {
    specialGauge = 0;
    isInvincible = true;
    invincibleTimer = 300; // 60fps * 5秒 = 300フレーム
    
    // 画面上の全小言を消去
    bullets = [];
    
    // ご褒美ケーキを確定ドロップ
    setTimeout(() => {
        bullets.push({
            x: canvas.width,
            y: 200,
            text: "🍰 ケーキ食べる？",
            speed: 3,
            color: "#ff7ff5",
            type: "cake"
        });
    }, 1000);
}

// 敵の弾（小言）を生成
function spawnBullet() {
    if (gameOver || isInvincible) return;
    
    // ランダムに1つ小言を選択
    const template = textTemplates[Math.floor(Math.random() * textTemplates.length)];
    
    bullets.push({
        x: canvas.width,
        y: Math.random() * (canvas.height - 100) + 50, // 上下に見切れない範囲
        text: template.text,
        speed: template.speed,
        color: template.color,
        type: template.type
    });
}

// 弾生成の定期タイマー（1.5秒ごと）
setInterval(spawnBullet, 1500);

// パリィの衝突判定
function checkParry() {
    bullets.forEach((bullet, index) => {
        if (bullet.type === "cake") return; // ケーキはパリィしない
        
        // 文字の左端あたりと自機の距離で簡易判定
        let dist = Math.abs(bullet.x - player.x);
        let distY = Math.abs(bullet.y - player.y);
        
        // 自機の近く（パリィ判定内）でSpaceが押されたか
        if (dist < 60 && distY < 30) {
            bullets.splice(index, 1);
            score += 100;
            if (specialGauge < 100) specialGauge += 25; // 4回成功で満タン
            createEffect(bullet.x, bullet.y, "✨ PARRY !!", "#00ffcc");
        }
    });
}

// エフェクト文字の簡易表示用
let effects = [];
function createEffect(x, y, text, color) {
    effects.push({ x, y, text, color, timer: 30 });
}

// メインループ
function loop() {
    if (gameOver) return;

    // 1. アップデート
    if (player.isParrying) {
        player.parryTimer--;
        if (player.parryTimer <= 0) player.isParrying = false;
    }

    if (isInvincible) {
        invincibleTimer--;
        if (invincibleTimer <= 0) isInvincible = false;
    }

    // 弾の移動と自機ヒット判定
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        
        // 常に自機のY軸に少しずつ吸い寄せられる（必ず当たるホーミング）
        let dy = player.y - b.y;
        b.y += dy * 0.02; 
        b.x -= b.speed;

        // 自機との衝突（被弾）判定
        let dist = Math.abs(b.x - player.x);
        let distY = Math.abs(b.y - player.y);

        if (dist < 30 && distY < 20) {
            if (b.type === "cake") {
                // ケーキ獲得！
                score += 500;
                createEffect(player.x, player.y - 30, "💖 DELICIOUS!!", "#ff7ff5");
                bullets.splice(i, 1);
            } else if (!isInvincible) {
                // 小言を被弾
                life--;
                createEffect(player.x, player.y, "💥 OUT!!", "#ff4757");
                bullets.splice(i, 1);
                if (life <= 0) gameOver = true;
            }
        }

        // 画面外に出たら削除
        if (b.x < -200) {
            bullets.splice(i, 1);
        }
    }

    // 2. 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景グリッド風の線（シューティング感）
    ctx.strokeStyle = "#2a2a35";
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }

    // UI (スコア・ライフ・ゲージ)
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    
    // ライフ表示
    let heart = "💖".repeat(life) + "🖤".repeat(3 - life);
    ctx.fillText(`LIFE: ${heart}`, 200, 30);

    // 必殺技ゲージ
    ctx.fillStyle = "#444";
    ctx.fillRect(450, 15, 150, 15);
    ctx.fillStyle = specialGauge >= 100 ? "#ff1493" : "#ff8100";
    ctx.fillRect(450, 15, (specialGauge / 100) * 150, 15);
    ctx.fillStyle = "#fff";
    ctx.font = "12px Arial";
    ctx.fillText(specialGauge >= 100 ? "READY (Enter!)" : `GAUGE: ${specialGauge}%`, 460, 27);

    // 無敵エフェクト
    if (isInvincible) {
        ctx.strokeStyle = "rgba(255, 105, 180, 0.4)";
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff69b4";
        ctx.font = "20px Arial";
        ctx.fillText("🌹 いつもありがとうモード（無敵） 🌹", canvas.width/2 - 150, 30);
    }

    // 自機（プレイヤー）の描画
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.isParrying ? "#00ffcc" : (isInvincible ? "#ff69b4" : "#1e90ff");
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 自機のコアマーク
    ctx.fillStyle = "#fff";
    ctx.font = "12px Arial";
    ctx.fillText("🛠️", player.x - 7, player.y + 4);

    // パリィのシールド波形
    if (player.isParrying) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 20, -Math.PI/2, Math.PI/2);
        ctx.strokeStyle = "rgba(0, 255, 204, 0.6)";
        ctx.lineWidth = 5;
        ctx.stroke();
    }

    // 弾（小言文字列）の描画
    ctx.font = "bold 18px 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif";
    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        // 文字の背景に薄いボックスを敷く
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        let textWidth = ctx.measureText(b.text).width;
        ctx.fillRect(b.x - 5, b.y - 18, textWidth + 10, 24);

        // 文字本体
        ctx.fillStyle = b.color;
        ctx.fillText(b.text, b.x, b.y);
    });

    // エフェクトの描画
    for (let i = effects.length - 1; i >= 0; i--) {
        let ef = effects[i];
        ctx.fillStyle = ef.color;
        ctx.font = "bold 20px Arial";
        ctx.fillText(ef.text, ef.x, ef.y - (30 - ef.timer));
        ef.timer--;
        if (ef.timer <= 0) effects.splice(i, 1);
    }

    // ゲームオーバー画面
    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4757";
        ctx.font = "bold 40px Arial";
        ctx.fillText("説教タイム突入 (GAME OVER)", canvas.width / 2 - 250, canvas.height / 2 - 20);
        ctx.fillStyle = "#fff";
        ctx.font = "20px Arial";
        ctx.fillText(`最終スコア: ${score}`, canvas.width / 2 - 60, canvas.height / 2 + 20);
        ctx.fillText("Spaceキーを押して再挑戦", canvas.width / 2 - 110, canvas.height / 2 + 60);
    }

    requestAnimationFrame(loop);
}

// ゲーム起動
loop();
</script>
</body>
</html>
